<header><div class="wrap"><h1>rover｜成本分析表</h1><p>廣達 × 長庚大學　|　2026/11/10　|　拉動左側拉桿即時重算　|　機構見 trc_rover_v1.html，競賽計畫見 trc_plan.html　|　匯率 1 USD = 32 TWD</p></div></header>

<script>

var GRIP=[
{n:'簡化夾爪',c:40000,kg:1,lines:[['腕與夾爪','簡化夾爪',40000,'估算']]},
{n:'RH-P12 級＋指尖',c:70000,kg:1.5,lines:[['腕與夾爪','夾爪 RH-P12 級＋指尖鉤',70000,'夾爪 5 萬、指尖 2 萬，皆估算']]},
{n:'建議夾爪＋備用指尖',c:110000,kg:1.5,lines:[['腕與夾爪','夾爪 RH-P12 級＋指尖鉤',70000,'估算'],['腕與夾爪','備用指尖',40000,'奪牌加項']]}];
var SENS=[
{n:'1 LiDAR＋1 D455',c:73000,kg:.6,lead:5,lines:[['感測','Hokuyo UST-10LX ×1',53000,'日本'],['感測','RealSense D455 ×1',20000,'不用 D455f']]},
{n:'2 LiDAR＋D455＋D405',c:138000,kg:1,lead:6,lines:[['感測','Hokuyo UST-10LX ×2',106000,'US$1,670×32×2'],['感測','RealSense D455',20000,'不用 D455f'],['感測','RealSense D405 級',12000,'採購時核產地']]},
{n:'建議感測＋備用 D455',c:158000,kg:1,lead:6,lines:null}];
SENS[2].lines=SENS[1].lines.concat([['感測','備用 D455',20000,'奪牌加項']]);
var POWER=[
{n:'精簡人機與安全',c:58000,src:'人機 1 萬、DC-DC 1.5 萬、Pilz 2.5 萬、Moxa 0.8 萬',lines:[['人機','面板、喇叭、麥克風',10000],['電源安全','DC-DC 與線束',15000],['電源安全','Pilz 與急停',25000],['電源安全','Moxa',8000]]},
{n:'建議人機與安全',c:79500,src:'面板 8,000、喇叭 3,000、麥克風 3,500、DC-DC 18,000、Pilz 35,000、Moxa 12,000',lines:[['人機','10.1 吋面板',8000],['人機','喇叭與功放',3000],['人機','USB 麥克風，不用 ReSpeaker',3500],['電源安全','DC-DC、保險絲、線束',18000],['電源安全','Pilz 安全繼電器＋急停',35000],['電源安全','Moxa EDS-2005-EL',12000]]},
{n:'建議安全＋第二急停與備用電池',c:129500,src:'建議方案再加第二急停站 2 萬、備用電池 3 萬',lines:null}];
POWER[2].lines=POWER[1].lines.concat([['電源安全','第二急停站',20000],['電源安全','備用電池 20Ah',30000]]);
var FAB=[{n:'結構與道具從簡',c:80000,src:'各 4 萬',lines:[['製作','結構',40000],['製作','道具',40000]]},{n:'結構 6 萬＋道具 6 萬',c:120000,src:'長庚製作，估算',lines:[['製作','鋁擠、蓋板、立柱',60000],['製作','藥車、床旁櫃、器具桌、按鈕、假人',60000]]},{n:'建議製作＋追加',c:190000,src:'再加加工 3 萬、道具 4 萬',lines:null}];
FAB[2].lines=FAB[1].lines.concat([['製作','追加加工',30000],['製作','道具加做',40000]]);
var TEST=[{n:'基本儀器',c:15000,src:'估算',lines:[['測試','磅秤、功率計、治具',15000]]},{n:'建議儀器',c:25000,src:'估算',lines:[['測試','磅秤、功率計、標定治具',25000]]},{n:'建議儀器＋GPU 工作站',c:105000,src:'工作站 8 萬，不上車',lines:[['測試','測試儀器',25000],['測試','GPU 工作站',80000]]}];
var TRAVEL=[{n:'差旅從簡',c:90000,src:'含保險',lines:[['差旅','差旅與運輸保險',90000]]},{n:'高雄差旅＋保險',c:145000,src:'12 萬＋2.5 萬',lines:[['差旅','高雄差旅',120000],['差旅','運輸保險',25000]]},{n:'建議差旅＋追加',c:185000,src:'再加 4 萬',lines:[['差旅','高雄差旅',120000],['差旅','運輸保險',25000],['差旅','差旅追加',40000]]}];
var CLAUDE=[{n:'4 席規劃值',c:60000,src:'保守方案'},{n:'14 席，約 4.5 個月',c:108000,src:'4 Premium＋10 Standard，US$3,375×32'},{n:'14 席＋API',c:148000,src:'再加 API 40,000'}];
var TECH=[{n:'不增加',c:0,p:0,src:'沒有專職組裝人手'},{n:'內部支援 1 名',c:0,p:.19,src:'現金不加。計畫書把前三名看法調到約 55%'},{n:'委外 1 名 4 個月',c:240000,p:.19,src:'奪牌配置才把這筆列入'}];
var FIX=[['運算','Jetson AGX Orin 開發套件',70000,'NVIDIA，不用研華工控機'],['腕與夾爪','腕部 Dynamixel ×3',27000,'ROBOTIS，估算'],['腕與夾爪','頭部轉台 Dynamixel ×2',10000,'ROBOTIS，估算'],['電源安全','24V 20Ah LiFePO4',30000,'電芯日韓、台灣組裝']];
var OPT={base:BASE,lift:LIFT,tele:TELE,grip:GRIP,sens:SENS,power:POWER,fab:FAB,test:TEST,travel:TRAVEL,claude:CLAUDE,tech:TECH};
var SL=[['base','底盤'],['lift','升降'],['tele','伸縮臂'],['grip','夾爪'],['sens','感測'],['power','人機與安全'],['fab','製作與道具'],['test','測試'],['travel','差旅'],['claude','Claude'],['tech','技術員']];
var PRE={'保守':{base:0,lift:0,tele:0,grip:0,sens:0,power:0,fab:0,test:0,travel:0,claude:0,tech:0,res:10,bud:1000000},'建議':{base:1,lift:1,tele:1,grip:1,sens:1,power:1,fab:1,test:1,travel:1,claude:1,tech:0,res:15,bud:2000000},'奪牌':{base:1,lift:1,tele:1,grip:2,sens:2,power:2,fab:2,test:2,travel:2,claude:2,tech:2,res:12,bud:3000000}};
var DEF=Object.assign({},PRE['建議']);
var S=Object.assign({},DEF);
var $=function(i){return document.getElementById(i)};
var wan=function(n){return (n/10000).toFixed(1)+' 萬'};
var CAT=['底盤','機構','腕與夾爪','感測','運算','人機','電源安全','製作','測試','差旅','Claude','技術員','預備金'];
var COL=['#0891b2','#2563eb','#db2777','#7c3aed','#4f46e5','#ca8a04','#ea580c','#65a30d','#0d9488','#0e7490','#64748b','#b45309','#9ca3af'];
function lines(s){
var o=[];
o.push(['底盤',BASE[s.base].n,BASE[s.base].c,BASE[s.base].src]);
o.push(['機構',LIFT[s.lift].n,LIFT[s.lift].c,LIFT[s.lift].src]);
o.push(['機構',TELE[s.tele].n,TELE[s.tele].c,TELE[s.tele].src]);
GRIP[s.grip].lines.forEach(function(r){o.push(r)});
SENS[s.sens].lines.forEach(function(r){o.push(r)});
FIX.forEach(function(f){o.push(f)});
POWER[s.power].lines.forEach(function(r){o.push([r[0],r[1],r[2],'見拉桿'])});
FAB[s.fab].lines.forEach(function(r){o.push([r[0],r[1],r[2],FAB[s.fab].src])});
TEST[s.test].lines.forEach(function(r){o.push([r[0],r[1],r[2],TEST[s.test].src])});
TRAVEL[s.travel].lines.forEach(function(r){o.push([r[0],r[1],r[2],TRAVEL[s.travel].src])});
o.push(['Claude',CLAUDE[s.claude].n,CLAUDE[s.claude].c,CLAUDE[s.claude].src]);
if(TECH[s.tech].c)o.push(['技術員',TECH[s.tech].n,TECH[s.tech].c,TECH[s.tech].src]);
return o}
function calc(s){
var items=lines(s);
var sub=items.reduce(function(a,r){return a+r[2]},0);
var res=Math.round(sub*s.res/100);
var cost=sub+res;
var full=s.base===1&&s.lift===1&&s.tele===1&&s.grip>=1&&s.sens>=1;
var p=full?(0.36+TECH[s.tech].p):(s.lift===0&&s.tele===0?0.22:0.28);
var w=48.5+LIFT[s.lift].kg+TELE[s.tele].kg+GRIP[s.grip].kg+SENS[s.sens].kg;
return {items:items,sub:sub,res:res,cost:cost,p:p,full:full,w:w,
nav:Math.min(.95,.72+.08*s.sens+.04*s.base),
drawer:Math.min(.95,.5+.18*s.tele+.14*(s.grip>=1?1:0)+.06*s.lift),
instr:Math.min(.95,.48+.16*s.lift+.14*(s.grip>=1?1:0)+.08*(s.sens>=1?1:0)),
vision:Math.min(.95,.7+.08*(s.sens>=1?1:0)+.04*(s.sens===2?1:0)),
button:Math.min(.95,.72+.1*s.tele+.06*s.lift)}}
function tag(){
var keys=['base','lift','tele','grip','sens','power','fab','test','travel','claude','tech','res'];
for(var name in PRE){var hit=true;keys.forEach(function(k){if(S[k]!==PRE[name][k])hit=false});if(hit)return name}return ''}
function build(){
var h='';
SL.forEach(function(x){h+='<div class="sl"><label><span>'+x[1]+'</span><span id="v_'+x[0]+'"></span></label><input type="range" id="s_'+x[0]+'" min="0" max="'+(OPT[x[0]].length-1)+'" step="1" value="'+S[x[0]]+'"><small id="d_'+x[0]+'"></small></div>'});
h+='<div class="sl"><label><span>預備金</span><span id="v_res"></span></label><input type="range" id="s_res" min="5" max="25" step="1" value="'+S.res+'"></div>';
h+='<div class="sl"><label><span>預算上限</span><span id="v_bud"></span></label><input type="range" id="s_bud" min="600000" max="3000000" step="50000" value="'+S.bud+'"></div>';
$('sliders').innerHTML=h;
$('presets').innerHTML=Object.keys(PRE).map(function(k){return '<button data-p="'+k+'">'+k+'</button>'}).join('')+'<button data-p="_">還原</button>';
Object.keys(S).forEach(function(k){$('s_'+k).oninput=function(){S[k]=+this.value;render()}});
$('presets').onclick=function(e){var p=e.target.dataset.p;if(!p)return;var v=p==='_'?DEF:PRE[p];Object.keys(v).forEach(function(k){S[k]=v[k];$('s_'+k).value=v[k]});render()}}
function kpi(l,v,sub,c){return '<div class="k '+c+'"><small>'+l+'</small><b>'+v+'</b><span>'+sub+'</span></div>'}
function dt(w){var d=new Date(2026,10,10);d.setDate(d.getDate()+Math.round(w*7));return (d.getMonth()+1)+'/'+d.getDate()}
function render(){
var o=calc(S),name=tag(),gap=o.cost-S.bud;
SL.forEach(function(x){var it=OPT[x[0]][S[x[0]]];$('v_'+x[0]).textContent=(S[x[0]]+1)+'/'+OPT[x[0]].length;$('d_'+x[0]).textContent=it.n+(it.c?'　'+wan(it.c):'')});
$('v_res').textContent=S.res+'%';$('v_bud').textContent=wan(S.bud);
var cc=gap<=0?'g':gap<=S.bud*.1?'a':'r';
var wc=o.w<=110?'g':o.w<=120?'a':'r';
var pc=o.p>=.5?'g':o.p>=.35?'a':'r';
var known={817300:'保守',1313875:'建議',1929200:'奪牌'}[o.cost];
$('kpis').innerHTML=kpi('總成本（含預備金）',wan(o.cost),o.cost.toLocaleString()+(known?'　對齊'+known:'　試算'),cc)+kpi('相對預算上限',gap<=0?'低 '+wan(-gap):'超 '+wan(gap),wan(S.bud),cc)+kpi('概念重量',o.w.toFixed(0)+' kg','建議方案 67。上限 120',wc)+kpi('前三名看法',Math.round(o.p*100)+'%',o.full?(S.tech?'加人後約 55%。70% 要 12/20 臂達標':'對齊計畫書 36%'):'機構低於建議方案',pc)+kpi('最長交期',SENS[S.sens].lead+' 週','LiDAR。11/17 下單',SENS[S.sens].lead>6?'a':'g')+kpi('小計',wan(o.sub),'預備金 '+S.res+'%　'+o.res.toLocaleString(),'');
var al=[];
if(known)al.push(['g','這組拉桿就是計畫書的'+known+'方案，合計 '+o.cost.toLocaleString()]);
if(gap>0)al.push(['r','超出預算上限 '+wan(gap)]);
if(S.base===0)al.push(['a','底盤只列改裝 8 萬。若必須按 18 萬入帳，再加 10 萬']);
if(S.base===1)al.push(['a','輪轂馬達產地還沒有證明。本週要拿到廣達底盤規格']);
if(S.lift===0||S.tele===0)al.push(['a','升降或伸縮短於 rover 建議值，器具桌與抽屜的餘裕會變小']);
if(S.sens===0)al.push(['a','只有一顆 LiDAR、一台相機。後方避障與腕部對準要後補']);
if(S.tech===0&&o.full)al.push(['a','建議方案沒有技術員。內部支援不加現金，看法約 55%；再加備用電池與相機 5 萬，約 136 萬']);
if(S.tech===2)al.push(['g','委外技術員 24 萬已列入。這是奪牌配置的人力，不是建議方案']);
if(!al.some(function(a){return a[0]==='r'}))al.push(['g','沒有超出預算或重量上限。rover 不借廠商整機']);
$('alerts').innerHTML=al.map(function(a){return '<div class="alert '+a[0]+'">'+a[1]+'</div>'}).join('');
var tot={};
o.items.forEach(function(i){tot[i[0]]=(tot[i[0]]||0)+i[2]});
